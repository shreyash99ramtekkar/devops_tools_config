apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: replicaset-1
  annotations:
    description: "This ReplicaSet manages two nginx replicas"
    owner: "DevOps Team"
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: nginx
  template:
    metadata:
      labels:
        tier: nginx
      annotations:
        note: "Pod created by replicaset-1"
        version: "v1.0"
    spec:
      containers:
      - name: nginx
        image: nginx
